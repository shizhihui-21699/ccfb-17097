[package]
name = "credops"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Find credentials passed on command lines, in environment variables and in shell history, then migrate them to protected channels"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
strip = "debuginfo"
